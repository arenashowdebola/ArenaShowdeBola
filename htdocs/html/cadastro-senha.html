<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Administrador</title>
  <link rel="stylesheet" href="../css/cadastro-senha.css" />
  <link rel="icon" href="../imgs/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet"></head>
  <style>
    .erro-quadro {
      border: 2px solid #e63946;
      background-color: #f8d7da;
      color: #e63946;
      padding: 12px 15px;
      margin-bottom: 15px;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
      display: none;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Central de Controle da Arena</h2>
    <p>Autenticação necessária para acesso administrativo</p>

    <div id="msg-erro" class="erro-quadro"></div>

    <form action="../php/senhaBD.php" method="POST">
      <div class="info-itemG">
        <label for="senha"  class="senha">
          <i class="fa-solid fa-lock"></i>
          Senha
        </label>
        <input type="password" id="senha" name="senha" required>
      </div> 

      <button type="submit" class="button-link">Acessar</button>
    </form>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const erro = params.get('erro');
    if (erro) {
      const msgErro = document.getElementById('msg-erro');
      if (erro === 'usuario') {
        msgErro.textContent = 'Usuário não encontrado!';
      } else if (erro === 'senha') {
        msgErro.textContent = 'Senha incorreta!';
      }
      msgErro.style.display = 'block';
      msgErro.style.opacity = '0';
      requestAnimationFrame(() => {
        msgErro.style.opacity = '1';
        setTimeout(() => {
          msgErro.style.opacity = '0';
          setTimeout(() => {
            msgErro.style.display = 'none';
            msgErro.textContent = '';
          }, 1000);
        }, 3000);
      });
    }
  </script>
  <button class="menu-float" onclick="window.location.href='cadastro.html'">←</button>

</body>
</html>
