<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro Cliente</title>
  <link rel="stylesheet" href="../css/cliente-cadastro.css">
  <link rel="icon" href="../imgs/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="form-box">
    <h2>Seu jogo começa aqui!  </h2>
    <p>Cadastro Cliente</p>
    <form action="../php/cadastrarcliente.php" method="POST">
      <div class="info-itemG">
        <label for="nome">
          <i class="fa-regular fa-user"></i>
          Nome Completo
        </label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="info-itemG">
        <label for="email">
          <i class="fa-regular fa-envelope"></i>
          Email
        </label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="info-itemG">
        <label for="telefone">
          <i class="fa-solid fa-phone"></i>
          Telefone
        </label>
        <input type="tel" id="telefone" name="telefone" required>
      </div>

      <div class="info-itemG">
        <label for="senha">
          <i class="fa-solid fa-lock"></i>
          Senha
        </label>
        <input type="password" id="senha" name="senha" required>
      </div>  

      <input type="submit" value="Cadastrar" class="botao-cadastrar">
    </form>
  </div>


  <button class="menu-float" onclick="window.location.href='cadastro.html'">←</button>
  <script src="../js/cadastro.js"></script>
</body>

</html>
